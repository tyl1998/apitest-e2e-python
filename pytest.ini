[pytest]
testpaths = test_case

# --- 日志打印格式 ---
# CLI 上每条日志：时间 | 级别 | 来源 | 内容
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
log_cli_auto_indent = false

# 未开启 log_cli 时的同款默认（capture 到 pytest 输出）
log_level = INFO
log_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_date_format = %H:%M:%S
