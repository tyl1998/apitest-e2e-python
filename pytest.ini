[pytest]
testpaths = test_case

# --- 日志打印格式 ---
# CLI 上每条日志：时间 | 级别 | 来源 | 内容
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S

# 未开启 log_cli 时的同款默认（capture 到 pytest 输出）
log_level = INFO
log_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_date_format = %H:%M:%S

# 并行（pytest-xdist -n）时 worker 内的日志不会转发到 CLI，落文件兜底查看。
# 串行跑时 CLI 直接打；两种方式下都会写 pytest.log。
log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S